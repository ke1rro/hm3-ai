[project]
name = "hm3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikita Lenyk", email = "nikitalenyk2@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate==1.16.0",
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tokenizers>=0.23.3",
    "torch==2.15.0",
    "transformers==5.24.0",
]

[project.scripts]
hm3 = "hm3:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "black[jupyter]>=26.10.1",
    "flake8>=7.5.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "isort>=9.0.2",
    "jupyterlab>=4.6.6",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-myst>=0.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ty>=0.0.107",
]
